name: Build executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # 1. Configurer MSBuild (nécessaire pour Visual Studio 2022 et le C++ workload)
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # 2. Configurer CMake
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v4
        with:
          cmake-version: 'latest'

      # 3. Configurer pnpm et Node.js (selon ton setup d'origine)
      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      # 4. Lancement du script de build existant (qui gère CMake / MSBuild en interne)
      - name: Build unsigned executable
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-unsigned
          path: WandEnhancer/bin/Release/WandEnhancer.exe
          if-no-files-found: error
